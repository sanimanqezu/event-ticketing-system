server:
  port: 8082

spring:
  application:
    name: bookings-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookings_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

events:
  service:
    url: ${EVENTS_SERVICE_URL:http://localhost:8081}

# Feign configuration
feign:
  client:
    config:
      events-service:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: BASIC
  circuitbreaker:
    enabled: true

# Resilience4j circuit breaker configuration
resilience4j:
  circuitbreaker:
    instances:
      events-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - feign.FeignException
          - java.io.IOException
  retry:
    instances:
      events-service:
        maxAttempts: 3
        waitDuration: 500ms
        retryExceptions:
          - feign.FeignException.ServiceUnavailable
          - java.io.IOException

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.sanele.bookings: DEBUG
    com.sanele.bookings.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
