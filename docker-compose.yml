services:
  events-service:
    build:
      context: ./events-service
      dockerfile: Dockerfile
    container_name: events-service
    restart: unless-stopped
    ports:
    - 8081:8081
    environment:
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: events_db
      DB_USERNAME: postgres
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health
        || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
    - portfolio-net
  bookings-service:
    build:
      context: ./bookings-service
      dockerfile: Dockerfile
    container_name: bookings-service
    restart: unless-stopped
    ports:
    - 8082:8082
    environment:
      DB_PASSWORD: postgres
      EVENTS_SERVICE_URL: http://events-service:8081
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: bookings_db
      DB_USERNAME: postgres
    depends_on:
      events-service:
        condition: service_healthy
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
